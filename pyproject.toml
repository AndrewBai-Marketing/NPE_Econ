[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structnpe"
version = "0.1.0b2"
description = "Approximate Bayesian posteriors for models you can simulate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Andrew Bai" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
neural = ["torch>=2.2", "nflows==0.14"]
# Backward-compatible spelling retained for alpha users.
torch = ["torch>=2.2", "nflows==0.14"]
build = ["build>=1.2"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "scipy>=1.11",
]
replication = [
  "torch>=2.2",
  "nflows==0.14",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.scripts]
structnpe = "structnpe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["structnpe", "structnpe.*"]
exclude = ["airline_compiler*", "ddc_npe*", "marketing_compiler*"]

[tool.setuptools.package-data]
structnpe = ["templates/**/*"]

[tool.setuptools.exclude-package-data]
structnpe = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: expensive simulator/grid tests",
]
