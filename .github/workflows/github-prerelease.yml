name: Build GitHub prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v0.1.0b1)
        required: true
        type: string
      publish_github_prerelease:
        description: Create the GitHub prerelease after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tests:
    name: Release tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the requested tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install base development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify snippets and package tests
        run: |
          python -c "import scipy; print(scipy.__version__)"
          python scripts/render_readme_examples.py --check
          python -m build --wheel --sdist
          python scripts/normalize_sdist.py dist/structnpe-0.1.0b1.tar.gz
          python -m pytest -q \
            tests/test_structnpe_*.py \
            tests/test_public_ci.py \
            tests/test_replication_*.py

  build:
    name: Build and verify release assets
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record and verify tagged source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${commit}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install \
            pip==25.3 \
            setuptools==80.9.0 \
            wheel==0.45.1 \
            build==1.5.0 \
            pytest==9.0.3
          python -m build --no-isolation --wheel --sdist

      - name: Normalize public sdist metadata
        run: python scripts/normalize_sdist.py dist/structnpe-0.1.0b1.tar.gz

      - name: Audit the exact distributions selected for upload
        env:
          STRUCTNPE_DIST_DIR: dist
        run: python -m pytest -q tests/test_structnpe_distribution_contents.py

      - name: Generate checksums and release manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python scripts/generate_release_assets.py \
            --dist-dir dist \
            --output-dir release-assets \
            --tag "${RELEASE_TAG}" \
            --commit "${RELEASE_COMMIT}"

      - name: Verify clean installed wheel and examples
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/structnpe-release-wheel"
          "${RUNNER_TEMP}/structnpe-release-wheel/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/structnpe-release-wheel/bin/python" -m pip install release-assets/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/structnpe-release-wheel/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/run_installed_wheel_examples.py" \
            --profile base --require-no-torch

      - name: Verify a clean install from the exact source distribution
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/structnpe-release-sdist"
          "${RUNNER_TEMP}/structnpe-release-sdist/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/structnpe-release-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/structnpe-release-sdist/bin/python" -c \
            "import importlib.metadata, structnpe; assert importlib.metadata.version('structnpe') == '0.1.0b1'"

      - name: Upload the verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structnpe-${{ inputs.tag }}-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  github-prerelease:
    name: Create GitHub prerelease
    if: ${{ inputs.publish_github_prerelease }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the requested tag for independent verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: structnpe-${{ inputs.tag }}-release-assets
          path: release-assets

      - name: Revalidate source and create GitHub prerelease (never PyPI)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_COMMIT}"
          mapfile -t remote_refs < <(
            git ls-remote --exit-code origin \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}"
          )
          remote_commit="$(printf '%s\n' "${remote_refs[@]}" | awk \
            -v peeled="refs/tags/${RELEASE_TAG}^{}" \
            '$2 == peeled {print $1; found=1} END {if (!found && NR == 1) print $1}')"
          test "${remote_commit}" = "${RELEASE_COMMIT}"
          (cd release-assets && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          manifest = json.loads((root / "release_manifest.json").read_text())
          assert manifest["source"] == {
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
          }
          for artifact in manifest["artifacts"]:
              path = root / artifact["filename"]
              assert path.is_file()
              assert path.stat().st_size == artifact["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact["sha256"]
          PY
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GH_REPO}" \
            --verify-tag \
            --prerelease \
            --notes-file docs/release/08_GITHUB_PRERELEASE_NOTES.md \
            --title "structnpe ${RELEASE_TAG}"
