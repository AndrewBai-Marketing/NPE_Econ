name: Public benchmark smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,replication]"

      - name: Check both benchmark implementations
        run: python -m pytest -q tests/test_replication_eight_schools.py tests/test_replication_rust.py

      - name: Run the custom-model training example
        run: python scripts/run_installed_wheel_examples.py --profile neural

      - name: Run the bounded Eight Schools comparison
        run: python replication/eight_schools/run_validation.py --profile smoke --quiet
