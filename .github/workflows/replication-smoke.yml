name: Neural replication smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-replication-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: CPU neural and validation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development and CPU neural dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,neural]"

      - name: Build the wheel
        run: python -m build --wheel

      - name: Exercise all bounded neural examples from a clean installed wheel
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/structnpe-neural-wheel"
          "${RUNNER_TEMP}/structnpe-neural-wheel/bin/python" -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name 'structnpe-*.whl' -print -quit)"
          "${RUNNER_TEMP}/structnpe-neural-wheel/bin/python" -m pip install "${wheel_path}[neural]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/structnpe-neural-wheel/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/run_installed_wheel_examples.py" \
            --profile neural

      - name: Exercise structural and Eight Schools examples from the installed wheel
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/structnpe-neural-wheel/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/run_installed_wheel_examples.py" \
            --profile validation

      - name: Run the declared replication smoke stages
        run: |
          python replication/scripts/run_all.py \
            --profile smoke \
            --only conjugate_normal,sbc_32,structural_grid,support_warning \
            --report replication/results/ci_smoke_report.json

      - name: Preserve the machine-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structnpe-replication-smoke-${{ github.run_id }}
          path: replication/results/ci_smoke_report.json
          if-no-files-found: warn
          retention-days: 14
